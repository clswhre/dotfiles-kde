cursor_shape beam
cursor_shape_unfocused beam
cursor_beam_thickness 0.6
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 0
cursor_trail 1
cursor_trail_decay 0.1 0.7
cursor_trail_start_threshold 0

background_blur 1
background_opacity 0.6
background_blur 24

